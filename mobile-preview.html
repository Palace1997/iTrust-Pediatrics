<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iTrust Pediatrics — Mobile Preview</title>
  <style>
    :root { --cream: #fbf7ee; --green-900: #1f4d2e; --green-700: #2f6b41; --sage: #7a9b54; --coral: #ee6c4d; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 2rem 1rem 3rem;
      background: radial-gradient(1200px 600px at 50% -10%, #e7eedd, #d7e0cb 60%, #cdd8bd);
      font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; gap: 1.2rem;
    }
    .mp-head { text-align: center; color: var(--green-900); }
    .mp-head h1 { font-size: 1.3rem; margin: 0 0 .25rem; font-weight: 800; }
    .mp-head p { margin: 0; color: var(--green-700); font-size: .9rem; }
    .mp-controls { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
    .mp-btn {
      border: 1.5px solid rgba(31,77,46,.3); background: rgba(255,255,255,.7); color: var(--green-700);
      font: 800 .82rem inherit; padding: .5rem .9rem; border-radius: 999px; cursor: pointer; transition: .2s;
    }
    .mp-btn:hover { background: #fff; }
    .mp-btn.active { background: var(--green-700); color: #fff; border-color: var(--green-700); }
    /* phone shell */
    .mp-phone {
      background: #0c1a10; padding: 14px; border-radius: 46px;
      box-shadow: 0 26px 70px rgba(20,40,26,.4); transition: width .35s cubic-bezier(.22,1,.36,1);
      max-width: 96vw;
    }
    .mp-screen {
      position: relative; background: var(--cream); border-radius: 34px; overflow: hidden;
      height: 78vh; min-height: 560px;
    }
    .mp-notch { position: absolute; top: 0; left: 0; right: 0; height: 26px; display: flex; align-items: center; justify-content: center; z-index: 3; pointer-events: none; }
    .mp-notch span { width: 120px; height: 7px; border-radius: 5px; background: #0c1a10; opacity: .8; }
    .mp-screen iframe { width: 100%; height: 100%; border: 0; display: block; }
    .mp-hint { color: var(--green-700); font-size: .82rem; opacity: .8; text-align: center; max-width: 420px; }
  </style>
</head>
<body>
  <div class="mp-head">
    <h1>iTrust Pediatrics — Mobile preview</h1>
    <p>The live site, rendered at a phone width. Scroll inside the phone.</p>
  </div>

  <div class="mp-controls">
    <button class="mp-btn active" data-w="390">Phone · 390</button>
    <button class="mp-btn" data-w="360">Small · 360</button>
    <button class="mp-btn" data-w="430">Large · 430</button>
    <button class="mp-btn" data-w="768">Tablet · 768</button>
  </div>

  <div class="mp-phone" id="phone" style="width: 418px;">
    <div class="mp-screen">
      <div class="mp-notch"><span></span></div>
      <iframe id="frame" src="index.html" title="iTrust Pediatrics mobile view"></iframe>
    </div>
  </div>

  <p class="mp-hint">Tip: this shows the real responsive layout. To test on the actual page instead, open <strong>index.html</strong> and narrow your browser window (or use DevTools device mode).</p>

  <script>
    var phone = document.getElementById("phone");
    var btns = document.querySelectorAll(".mp-btn");
    btns.forEach(function (b) {
      b.addEventListener("click", function () {
        var w = parseInt(b.getAttribute("data-w"), 10);
        phone.style.width = (w + 28) + "px"; /* +28 for the bezel padding */
        btns.forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
      });
    });
  </script>
</body>
</html>
